<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Tracker Pro</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f4f4f4; }
    header { background: #4CAF50; color: white; padding: 1rem; text-align: center; }
    .container { padding: 20px; }
    input, select, button { padding: 8px; margin: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #4CAF50; color: white; }
    .badge { padding: 4px 8px; border-radius: 6px; color: white; }
    .income { background: #2ecc71; }
    .expense { background: #e74c3c; }
  </style>
</head>
<body>

<header>
  <h1>Money Tracker</h1>
</header>

<div class="container">
  <h3>Tambah Transaksi</h3>
  <input type="text" id="desc" placeholder="Deskripsi">
  <input type="number" id="amount" placeholder="Jumlah">
  <select id="type">
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>
  <select id="category">
    <option value="Makanan">Makanan</option>
    <option value="Transport">Transport</option>
    <option value="Gaji">Gaji</option>
    <option value="Lainnya">Lainnya</option>
  </select>
  <button onclick="addTransaction()">Tambah</button>

  <h3>Filter</h3>
  <select onchange="filterType(this.value)">
    <option value="all">Semua</option>
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>

  <h3>Daftar Transaksi</h3>
  <table>
    <thead>
      <tr>
        <th>Deskripsi</th>
        <th>Jumlah</th>
        <th>Tipe</th>
        <th>Kategori</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <h3>Saldo: <span id="balance">0</span></h3>
  <h4>Total Pemasukan: <span id="incomeTotal">0</span></h4>
  <h4>Total Pengeluaran: <span id="expenseTotal">0</span></h4>
</div>

<script>
  let transactions = JSON.parse(localStorage.getItem('data')) || [];
  let currentFilter = 'all';

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';

    let balance = 0, income = 0, expense = 0;

    transactions
      .filter(t => currentFilter === 'all' || t.type === currentFilter)
      .forEach((t, i) => {
        const row = `<tr>
          <td>${t.desc}</td>
          <td>${t.amount}</td>
          <td><span class="badge ${t.type}">${t.type}</span></td>
          <td>${t.category}</td>
          <td><button onclick="deleteTx(${i})">Hapus</button></td>
        </tr>`;
        list.innerHTML += row;

        balance += t.type === 'income' ? t.amount : -t.amount;
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;
      });

    document.getElementById('balance').innerText = balance;
    document.getElementById('incomeTotal').innerText = income;
    document.getElementById('expenseTotal').innerText = expense;
  }

  function addTransaction() {
    const desc = document.getElementById('desc').value;
    const amount = parseInt(document.getElementById('amount').value);
    const type = document.getElementById('type').value;
    const category = document.getElementById('category').value;

    if (!desc || !amount) return alert('Isi semua field');

    transactions.push({ desc, amount, type, category });
    localStorage.setItem('data', JSON.stringify(transactions));
    render();
  }

  function deleteTx(index) {
    transactions.splice(index, 1);
    localStorage.setItem('data', JSON.stringify(transactions));
    render();
  }

  function filterType(type) {
    currentFilter = type;
    render();
  }

  render();
</script>

</body>
</html>
